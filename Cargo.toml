[package]
name = "redis-manager"
version = "0.1.0"
edition = "2021"
description = "Interactive Redis start/stop manager powered by egui"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = { version = "8", features = ["include-exclude"] }
self_update = { version = "1.3", default-features = false, features = ["reqwest", "rustls", "github", "archive-zip", "compression-zip-deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.4"
winres = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
